[project]
name = "gitlabci-sim"
version = "0.1.0"
description = "Simulate GitLab CI pipelines from a folder of YAML files"
authors = [
    { name = "Ofir", email = "nofatigua@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "rich>=13.7",
    "pyparsing>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "syrupy>=4",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
sim = "gitlabci_sim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/gitlabci_sim/cli.py" = ["B008"]  # typer requires call-in-default

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
