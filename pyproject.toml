[project]
name = "gitlabci-sim"
version = "0.2.0"
description = "Simulate GitLab CI pipelines from a folder of YAML files"
readme = "README.md"
authors = [
    { name = "Ofir", email = "nofatigua@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "rich>=13.7",
    "pyparsing>=3.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "syrupy>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
sim = "gitlabci_sim.cli:app"
sim-web = "gitlabci_sim.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlabci_sim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/gitlabci_sim/cli.py" = ["B008"]  # typer requires call-in-default
"src/gitlabci_sim/web/app.py" = ["B008"]  # FastAPI requires Form(...) in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
